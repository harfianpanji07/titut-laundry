{% extends "base.html" %}
{% block title %}Error {{ kode or '' }} — Putra Laundry{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-slate-200/80 shadow-xs text-center">
    <div class="w-12 h-12 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl font-bold mx-auto mb-4">
      ⚠️
    </div>
    <p class="text-xs font-bold text-rose-600 uppercase tracking-wider">Error {{ kode or '404' }}</p>
    <h2 class="text-lg font-bold text-slate-800 mt-1">{{ pesan or 'Halaman tidak ditemukan.' }}</h2>
    <div class="mt-6">
      <a href="{{ url_for('dashboard') }}" class="inline-flex items-center justify-center px-5 py-2.5 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold rounded-xl shadow-xs transition">
        Kembali ke Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
